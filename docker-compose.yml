services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ct-core:local}
    pull_policy: never
    container_name: ${CONTAINER_NAME:-ct-core-local}
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: production
      GIN_MODE: release
      GOLANG_PORT: ${CONTAINER_PORT:-8888}
    ports:
      - "${HOST_PORT:-8888}:${CONTAINER_PORT:-8888}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider "http://127.0.0.1:$${GOLANG_PORT}/health"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - web

networks:
  web:
    external: true
    name: ${DOCKER_NETWORK:-web}
