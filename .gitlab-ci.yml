stages:
  - deploy

.deploy:
  stage: deploy
  interruptible: false
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_NETWORK: web
    ENV_FILE: .env.deploy
    DEPLOY_WAIT_TIMEOUT: "90"
  before_script:
    - docker version
    - docker compose version
  script:
    - |
      if [ -z "${APP_ENV_FILE:-}" ]; then
        echo "APP_ENV_FILE belum dikonfigurasi pada GitLab CI/CD Variables."
        exit 1
      fi

      umask 077
      if [ -f "$APP_ENV_FILE" ]; then
        cp "$APP_ENV_FILE" "$ENV_FILE"
      else
        printf '%s\n' "$APP_ENV_FILE" > "$ENV_FILE"
      fi

      chmod 600 "$ENV_FILE"
    - sh docker/deploy.sh
  after_script:
    - rm -f .env.deploy

production:
  extends: .deploy
  resource_group: ct-core-production
  environment:
    name: production
  variables:
    COMPOSE_PROJECT_NAME: ct-core-prod
    CONTAINER_NAME: ct-core-prod
    IMAGE_NAME: ct-core:production
    HOST_PORT: "8888"
    CONTAINER_PORT: "8888"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deployment_staging:
  extends: .deploy
  resource_group: ct-core-staging
  environment:
    name: staging
  variables:
    COMPOSE_PROJECT_NAME: ct-core-staging
    CONTAINER_NAME: ct-core-staging
    IMAGE_NAME: ct-core:staging
    HOST_PORT: "18888"
    CONTAINER_PORT: "18888"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
